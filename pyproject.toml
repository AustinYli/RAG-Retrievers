[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-bench"
version = "0.1.0"
description = "Small BEIR RAG/retrieval benchmarking harness."
requires-python = ">=3.10"
dependencies = [
  "beir",
  "sentence-transformers",
  "faiss-cpu",
  "rank_bm25",
  "numpy",
  "pandas",
  "scipy",
  "tqdm",
  "pyyaml",
  "pytrec_eval",
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
